plugins { id 'com.android.application' }
android {
 namespace 'com.oddfactory.erpincharging'
 compileSdk 35
 defaultConfig { applicationId 'com.oddfactory.erpincharging'; minSdk 34; targetSdk 35; versionCode 28; versionName '1.2.6' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.assets.setSrcDirs([file('src/main/assets')])
 buildTypes { release { debuggable false; crunchPngs false; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
 lint { abortOnError true;checkReleaseBuilds true }
 buildFeatures { buildConfig true }
 
}


